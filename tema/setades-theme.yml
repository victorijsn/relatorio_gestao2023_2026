# =============================================================================
# Tema Asciidoctor PDF — Identidade Visual do Governo do Estado do ES (SECOM-ES)
# Projeto: Relatório de Gestão SETADES (2023–2026)
# =============================================================================
# Paleta Oficial SECOM-ES:
#   Azul 1:    #5081A0 | Azul 2:    #366C88 | Azul 3:    #365A6D
#   Marsala 1: #B16C73 | Marsala 2: #9C5C6A | Marsala 3: #7B4A55
#   Cinza 1:   #CFCFCF | Cinza 2:   #7B7B7A | Cinza 3:   #585857
#   Alerts:    Sucesso #28A058 | Advertência #E2DD2D | Info #5081A0 | Erro #9C5C6A
# =============================================================================

extends: default-with-font-fallbacks

font:
  catalog:
    merge: true
    OpenSans:
      normal: OpenSans-Regular.ttf
      italic: OpenSans-Italic.ttf
      bold: OpenSans-Bold.ttf
      bold_italic: OpenSans-BoldItalic.ttf
    OpenSansSemiBold:
      normal: OpenSans-SemiBold.ttf
      italic: OpenSans-SemiBoldItalic.ttf
      bold: OpenSans-Bold.ttf
      bold_italic: OpenSans-BoldItalic.ttf
    OpenSansExtraBold:
      normal: OpenSans-ExtraBold.ttf
      italic: OpenSans-ExtraBoldItalic.ttf
      bold: OpenSans-ExtraBold.ttf
      bold_italic: OpenSans-ExtraBoldItalic.ttf

page:
  layout: portrait
  size: A4
  margin: [2.2cm, 2cm, 2.2cm, 2cm]
  background-color: #FFFFFF

base:
  font-family: OpenSans
  font-color: #000000
  font-size: 10
  line-height-length: 15
  line-height: $base-line-height-length / $base-font-size
  align: justify
  border-color: #CFCFCF
  border-width: 0.75

vertical-spacing: 10

link:
  font-color: #9C5C6A
  font-style: bold
  text-decoration: underline

# Capa do Relatório (Title Page)
title-page:
  align: center
  background-color: #FFFFFF
  logo:
    top: 10%
    align: center
  title:
    top: 42%
    font-family: OpenSansExtraBold
    font-size: 24
    font-color: #366C88
    line-height: 1.25
  subtitle:
    font-family: OpenSans
    font-size: 14
    font-style: bold
    font-color: #9C5C6A
    margin-top: 8
  authors:
    margin-top: 24
    font-family: OpenSansSemiBold
    font-size: 10
    font-color: #585857
  revision:
    margin-top: 6
    font-family: OpenSans
    font-size: 9
    font-color: #7B7B7A

# Hierarquia Tipográfica (Manual SECOM-ES p. 4 e p. 5)
heading:
  font-family: OpenSans
  line-height: 1.25
  margin-top: 14
  margin-bottom: 8
  # Part / Subsecretaria
  h1:
    font-family: OpenSansExtraBold
    font-size: 20
    font-color: #366C88
    border-bottom-width: 1.5
    border-bottom-color: #5081A0
    padding-bottom: 6
    margin-bottom: 14
  # Capítulo / Gerência ou Unidade
  h2:
    font-family: OpenSansExtraBold
    font-size: 16
    font-color: #366C88
    border-bottom-width: 0.75
    border-bottom-color: #CFCFCF
    padding-bottom: 4
  # Nome da Ação / Projeto / Processo (Subtítulo Nível 2 - 13pt Bold Cinza 2 / Azul 2)
  h3:
    font-family: OpenSans
    font-size: 13
    font-style: bold
    font-color: #366C88
    margin-top: 12
    margin-bottom: 6
  # Tópicos da Ficha (1. Descrição, 2. Entregas, 3. Desafios)
  h4:
    font-family: OpenSansSemiBold
    font-size: 10.5
    font-style: bold
    font-color: #9C5C6A
    margin-top: 10
    margin-bottom: 4
  h5:
    font-family: OpenSansSemiBold
    font-size: 9.5
    font-color: #5081A0

# Classes de Estilo Customizadas (Manual SECOM-ES p. 4-5)
role:
  introducao:
    font-family: OpenSansSemiBold
    font-size: 8
    font-color: #9C5C6A
  detalhe:
    font-family: OpenSansSemiBold
    font-size: 8
    font-color: #5081A0
  subtitulo:
    font-family: OpenSans
    font-size: 13
    font-style: bold
    font-color: #7B7B7A
  tag:
    font-family: OpenSans
    font-size: 6
    font-style: bold
    font-color: #7B7B7A
    text-transform: uppercase

# Sumário (TOC)
toc:
  font-family: OpenSans
  font-size: 9.5
  line-height: 1.5
  dot-leader:
    font-color: #CFCFCF
  h1-font-color: #366C88
  h1-font-style: bold
  h2-font-color: #585857
  h2-font-style: bold
  h3-font-color: #7B7B7A

# Listas (Manual SECOM-ES p. 7: Open Sans Regular 8-9pt, Cor Cinza 2 #7B7B7A, Recuo 10px)
list:
  indent: 15
  item-spacing: 4
  marker-font-color: #366C88

# Separadores (Manual SECOM-ES p. 8: 1px Cinza 1 #CFCFCF)
thematic-break:
  border-color: #CFCFCF
  border-style: solid
  border-width: 0.75
  margin-top: 10
  margin-bottom: 10

# Citações (Manual SECOM-ES p. 4-5: Open Sans Italic 10pt, Preto)
quote:
  font-family: OpenSans
  font-size: 10
  font-style: italic
  font-color: #000000
  border-left-color: #9C5C6A
  border-left-width: 2.5
  padding: [6, 12, 6, 14]

# Caixas / Boxes (Manual SECOM-ES p. 15: Borda 1px Cinza 1 #CFCFCF, Recuo 20px)
sidebar:
  background-color: #FFFFFF
  border-color: #CFCFCF
  border-width: 0.75
  border-radius: 0
  padding: [14, 14, 14, 14]
  title:
    font-family: OpenSans
    font-size: 11
    font-style: bold
    font-color: #366C88
    align: left

# Alerts / Admonitions (Manual SECOM-ES p. 16)
admonition:
  font-size: 9.5
  padding: [10, 12, 10, 12]
  column-rule-color: #CFCFCF
  column-rule-width: 0.75
  label:
    font-family: OpenSans
    font-size: 9
    font-style: bold
  icon:
    note:
      stroke-color: #5081A0
    tip:
      stroke-color: #28A058
    warning:
      stroke-color: #E2DD2D
    caution:
      stroke-color: #9C5C6A
    important:
      stroke-color: #9C5C6A

# Tabelas (Manual SECOM-ES p. 13: Cabeçalho Azul 3 #365A6D / Azul 2 #366C88, Bordas Cinza 1 #CFCFCF)
table:
  background-color: #FFFFFF
  border-color: #CFCFCF
  border-width: 0.75
  grid-color: #CFCFCF
  grid-width: 0.5
  cell-padding: [6, 8, 6, 8]
  font-size: 9
  head:
    font-family: OpenSans
    font-size: 9.5
    font-style: bold
    font-color: #FFFFFF
    background-color: #365A6D
    border-bottom-width: 1
    border-bottom-color: #366C88
  body:
    stripe-background-color: #F9F9F9
  foot:
    background-color: #CFCFCF
    font-color: #585857
    font-style: bold

# Legendas (Manual SECOM-ES p. 13: Open Sans Regular 6-8pt Cinza 2)
caption:
  font-family: OpenSans
  font-size: 8
  font-style: bold
  font-color: #7B7B7A
  align: left
  margin-inside: 4

# Notas de rodapé (renderizadas ao pé da página via scripts/rodape_por_pagina.rb)
footnotes:
  font-family: OpenSans
  font-size: 8
  font-color: #585857
  line-height: 1.3
  item-spacing: 3
  margin-top: auto

# Cabeçalho e Rodapé com Paginação SECOM-ES (p. 24: Marsala 1 #B16C73 / Cinza 1 #CFCFCF)
header:
  height: 1.4cm
  border-color: #CFCFCF
  border-width: 0.5
  font-family: OpenSansSemiBold
  font-size: 7.5
  font-color: #7B7B7A
  recto:
    left:
      content: 'GOVERNO DO ESTADO DO ESPÍRITO SANTO • SETADES'
    right:
      content: '{document-title}'
  verso:
    left:
      content: 'GOVERNO DO ESTADO DO ESPÍRITO SANTO • SETADES'
    right:
      content: '{document-title}'

footer:
  height: 1.4cm
  border-color: #CFCFCF
  border-width: 0.5
  font-family: OpenSans
  font-size: 8
  font-color: #7B7B7A
  recto:
    left:
      content: '{chapter-title}'
    right:
      content: 'Página *{page-number}* de {page-count}'
  verso:
    left:
      content: '{chapter-title}'
    right:
      content: 'Página *{page-number}* de {page-count}'
